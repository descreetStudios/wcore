name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows / MSVC Release
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Ensure Ninja
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y --no-progress
          }
          ninja --version

      - name: Configure
        run: cmake --preset release

      - name: Build
        run: cmake --build --preset Release

      - name: Test
        run: ctest --preset Release --output-on-failure --timeout 60

  linux:
    name: Linux / GCC Release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Ensure Ninja
        run: |
          command -v ninja || (sudo apt-get update && sudo apt-get install -y ninja-build)

      - name: Configure
        run: cmake --preset release

      - name: Build
        run: cmake --build --preset Release

      - name: Test
        run: ctest --preset Release --output-on-failure --timeout 60

  linux-debug:
    name: Linux / GCC Debug
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Ensure Ninja
        run: |
          command -v ninja || (sudo apt-get update && sudo apt-get install -y ninja-build)

      - name: Configure
        run: cmake --preset debug

      - name: Build
        run: cmake --build --preset Debug

      - name: Test
        run: ctest --preset Debug --output-on-failure --timeout 60

  macos:
    name: macOS / AppleClang Release
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Ensure Ninja
        run: command -v ninja || brew install ninja

      - name: Configure
        run: cmake --preset release

      - name: Build
        run: cmake --build --preset Release

      - name: Test
        run: ctest --preset Release --output-on-failure --timeout 60
